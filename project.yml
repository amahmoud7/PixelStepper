name: PixelStepper
options:
  bundleIdPrefix: com.pixelpalfit
  deploymentTarget:
    iOS: "16.2"
    watchOS: "9.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: 6AU8GNH8CT

schemes:
  PixelPal:
    build:
      targets:
        PixelPal: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
    test:
      targets:
        - PixelPalTests
        - PixelPalUITests

targets:
  PixelPal:
    type: application
    platform: iOS
    sources:
      - path: PixelPal/Sources
      - path: PixelPal/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelpalfit.app
        INFOPLIST_FILE: PixelPal/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PixelPal/PixelPal.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: PixelPal/PixelPal.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.pixelpalfit.app
    dependencies:
      - target: PixelPalWidget
        embed: true
      # Companion Apple Watch app, embedded in the iPhone app's Watch folder.
      - target: PixelPalWatch
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: true
        com.apple.ApplicationGroups.iOS:
          enabled: true

  PixelPalWidget:
    type: app-extension
    platform: iOS
    product: PixelPalWidget
    sources:
      - path: PixelPalWidget/Sources
      - path: PixelPalWidget/Resources
      - path: PixelPal/Sources/Core/AvatarState.swift
      - path: PixelPal/Sources/Core/SharedData.swift
      - path: PixelPal/Sources/Core/SpriteAssets.swift
      - path: PixelPal/Sources/Core/PixelPalAttributes.swift
      - path: PixelPal/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelpalfit.app.widget
        INFOPLIST_FILE: PixelPalWidget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PixelPalWidget/PixelPalWidget.entitlements
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: PixelPalWidget/PixelPalWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pixelpalfit.app
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: true

  PixelPalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PixelPalTests
    dependencies:
      - target: PixelPal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelpalfit.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  PixelPalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PixelPalUITests
    dependencies:
      - target: PixelPal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelpalfit.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: PixelPal

  PixelPalWatch:
    type: application
    platform: watchOS
    sources:
      - path: PixelPalWatch/Sources
      - path: PixelPalWatch/Resources
      # Shared with the iPhone app (Foundation-only).
      - path: PixelPal/Sources/Core/AvatarState.swift
      - path: PixelPal/Sources/Core/SpriteAssets.swift
      - path: PixelPal/Sources/Core/WatchSnapshot.swift
    info:
      path: PixelPalWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pixel Stepper
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.pixelpalfit.app
        NSHealthShareUsageDescription: Pixel Stepper reads your step count to show your character and progress on your wrist.
    entitlements:
      path: PixelPalWatch/PixelPalWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelpalfit.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: true
